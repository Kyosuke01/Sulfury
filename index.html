    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/home.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <nav class="nav" id="nav">
        <div class="nav_burger" id="nav_burger_wrapper">
            <p id="nav_burger">&#x2630;</p>
        </div>
         <ul class="nav_link" id="nav_link">
            <li>
                <a href="./" class="sulfuryLogo" id="logo_link">
                    <img id="logo_sulfury" src="images/sulfury-border.png" alt="Logo Sulfury" draggable="false"
                        oncontextmenu="return false;">
                    <h1>Sulfury</h1>
                </a>
            </li>
            <li><a class="page-select nav-select nav_link_home" id="nav_link_home">
                <i class="fa-solid fa-fire-flame-curved"></i>&nbsp;Accueil</a></li>
            <li><a class="nav-select nav_link_equipe" id="nav_link_equipe" href="equipe">
                <i class="fa-solid fa-user-group"></i>&nbsp;Équipe</a></li>
            <li><a class="nav_link_join" id="nav_link_join" href="https://discord.gg/VFMfByp3ed" target="_blank">
                <i class="fa-brands fa-discord"></i>&nbsp;Rejoindre</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="present">
            <div class="present-texte">
                <div id="message-container">
                    <span>Serveur </span><span id="message"></span><span id="cursor"></span>
                </div>
                <div id="divTexte"></div>

                <div class="hero-cta">
                    <a class="btn-primary" href="https://discord.gg/VFMfByp3ed" target="_blank">
                        <i class="fa-brands fa-discord"></i> Rejoindre le serveur
                    </a>
                    <a class="btn-secondary" href="equipe">
                        <i class="fa-solid fa-users"></i> L'équipe
                    </a>
                </div>
            </div>
        </div>

        <div class="emoji-wave">
            <img src="images/Fluent_wave.png" alt="Émoji vague" draggable="false">
        </div>
    </section>

    <script src="https://kit.fontawesome.com/cb9da243d3.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.1/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 600, easing: 'ease-out' });
    </script>
    <script src="js/home.js"></script>
    <script src="js/nav_bar.js"></script>
